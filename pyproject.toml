[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dartseq-indel-finder"
version = "2.0.0"
description = "Detect, filter and select InDels from DArTseq that differentiate groups of samples (cultivars/species) and design HRM assays."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Karolinni Bianchi Britto" },
    { name = "Heberth de Paula" },
    { name = "José Aires Ventura" },
    { name = "Raphaella Luisa Fernandes de Almeida" },
    { name = "Matheus Paulo Bastos" },
    { name = "Artur Sant'Anna" },
    { name = "Greiciane Gaburro Paneto" },
]
keywords = ["InDel", "DArTseq", "HRM", "high resolution melting", "primer design",
            "genomics", "bioinformatics"]
dependencies = [
    "primer3-py>=2.0",
    "biopython>=1.80",
    "numpy",
    "openpyxl",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/BioinfoUfes/DArTseq_InDel_Finder"

[project.scripts]
dartseq-indel-finder = "indel_hrm.cli:main_cli"

[tool.setuptools]
packages = ["indel_hrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
